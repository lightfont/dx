<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dx/ — Clinical Reasoning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ── RESET & TOKENS ─────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;
  --surface:#161920;
  --surface2:#1e222d;
  --surface3:#252a38;
  --border:#2a3040;
  --border2:#333d52;
  --text:#e8eaf0;
  --muted:#7a8499;
  --muted2:#4a5568;
  --accent:#4f9cf9;
  --accent-dim:#1e3a5a;
  --accent-glow:rgba(79,156,249,0.15);
  --green:#22d37a;
  --green-dim:#0d2e1f;
  --yellow:#f5c842;
  --yellow-dim:#2e2510;
  --red:#f25c5c;
  --red-dim:#2e1010;
  --orange:#f8943a;
  --orange-dim:#2e1b08;
  --purple:#a78bfa;
  --purple-dim:#1e1730;
  --teal:#2dd4bf;
  --teal-dim:#0d2825;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --radius:8px;
  --radius-lg:14px;
}

body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
#app-wrap{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ─────────────────────────────────────────────────────────────── */
#sidebar{
  width:260px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:width .25s ease;
}
#sidebar.collapsed{width:0}
.sb-header{
  padding:18px 16px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.sb-logo{font-family:var(--mono);font-size:1.25rem;font-weight:700;letter-spacing:-1px;color:var(--text)}
.sb-logo span{color:var(--accent)}
.sb-tagline{font-size:0.7rem;color:var(--muted);margin-top:2px;font-style:italic}
.sb-cases{flex:1;overflow-y:auto;padding:8px 0}
.sb-section-label{
  font-family:var(--mono);font-size:0.62rem;font-weight:600;letter-spacing:.12em;
  color:var(--muted2);text-transform:uppercase;
  padding:12px 16px 6px;
}
.sb-case-btn{
  width:100%;background:none;border:none;cursor:pointer;
  padding:9px 16px;text-align:left;
  display:flex;align-items:center;gap:10px;
  transition:background .12s;
  border-left:3px solid transparent;
}
.sb-case-btn:hover{background:var(--surface2)}
.sb-case-btn.active{background:var(--accent-dim);border-left-color:var(--accent)}
.sb-case-btn .case-num{font-family:var(--mono);font-size:0.68rem;color:var(--muted);min-width:28px}
.sb-case-btn .case-title{font-size:0.82rem;color:var(--text);line-height:1.3;flex:1}
.sb-case-btn.active .case-title{color:var(--accent)}
.sb-case-btn .case-badge{font-size:0.65rem;font-family:var(--mono);padding:1px 5px;border-radius:4px;flex-shrink:0}
.sb-case-btn .case-badge.win{background:var(--green-dim);color:var(--green)}
.sb-case-btn .case-badge.lose{background:var(--red-dim);color:var(--red)}
.sb-case-btn .case-badge.miss{background:var(--red-dim);color:var(--red)}

/* ── MAIN AREA ───────────────────────────────────────────────────────────── */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ── TOP BAR ─────────────────────────────────────────────────────────────── */
#topbar{
  padding:12px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  background:var(--surface);
  flex-shrink:0;
  position:sticky;top:0;z-index:100;
}
.tb-toggle{
  background:none;border:1px solid var(--border2);border-radius:6px;
  padding:6px 9px;cursor:pointer;color:var(--muted);font-size:0.85rem;
  transition:all .15s;
}
.tb-toggle:hover{border-color:var(--accent);color:var(--accent)}
.tb-title{font-family:var(--mono);font-size:0.88rem;font-weight:600;color:var(--muted)}
.tb-case-name{font-size:0.88rem;color:var(--text);font-weight:600}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-phase{
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  padding:4px 10px;border-radius:20px;letter-spacing:.04em;
}
.tb-phase.phase-1{background:var(--purple-dim);color:var(--purple)}
.tb-phase.phase-2{background:var(--teal-dim);color:var(--teal)}
.tb-phase.phase-commit{background:var(--orange-dim);color:var(--orange)}
.tb-phase.phase-debrief{background:var(--green-dim);color:var(--green)}
.efficiency-meter{
  display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:0.72rem;color:var(--muted);
}
.eff-bar{width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.eff-fill{height:100%;border-radius:3px;transition:width .4s ease,background .4s}

/* ── CONTENT AREA ────────────────────────────────────────────────────────── */
#content{flex:1;padding:24px 28px;max-width:820px;margin:0 auto;width:100%}

/* ── WELCOME SCREEN ──────────────────────────────────────────────────────── */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:70vh;gap:8px;text-align:center;
}
.welcome-logo{font-family:var(--mono);font-size:3.5rem;font-weight:700;letter-spacing:-4px;color:var(--text)}
.welcome-logo span{color:var(--accent)}
.welcome-sub{font-size:0.95rem;color:var(--muted);max-width:340px;line-height:1.7;margin-top:4px}
.welcome-hint{
  margin-top:28px;font-size:0.78rem;color:var(--muted2);
  border:1px dashed var(--border2);border-radius:var(--radius);
  padding:10px 18px;font-family:var(--mono);
}

/* ── PHASE LABELS ────────────────────────────────────────────────────────── */
.phase-header{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;
}
.ph-num{
  font-family:var(--mono);font-size:0.65rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;
}
.ph-num.p1{background:var(--purple-dim);color:var(--purple)}
.ph-num.p2{background:var(--teal-dim);color:var(--teal)}
.ph-num.pc{background:var(--orange-dim);color:var(--orange)}
.ph-num.pd{background:var(--green-dim);color:var(--green)}
.ph-title{font-size:1.1rem;font-weight:700;color:var(--text)}
.ph-sub{font-size:0.8rem;color:var(--muted);margin-top:1px}

/* ── VIGNETTE CARD ───────────────────────────────────────────────────────── */
.vignette-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:20px;
  border-left:3px solid var(--accent);
}
.vignette-label{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;
}
.vignette-text{font-size:1rem;line-height:1.75;color:var(--text)}

/* ── VITAMIN CDE SCAFFOLD ────────────────────────────────────────────────── */
.scaffold-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;
}
.scaffold-label{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.scaffold-grid{display:flex;flex-wrap:wrap;gap:6px}
.vit-chip{
  padding:5px 11px;border-radius:20px;font-size:0.75rem;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border2);color:var(--muted);
  background:var(--surface2);transition:all .15s;user-select:none;
  font-family:var(--mono);
}
.vit-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.vit-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.vit-hint{font-size:0.72rem;color:var(--muted);margin-top:10px;line-height:1.5;font-style:italic}

/* ── DIFFERENTIAL BUILDER ────────────────────────────────────────────────── */
.diff-builder{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;
}
.diff-builder-label{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
  margin-bottom:14px;
}

/* search input */
.search-wrap{position:relative;margin-bottom:14px}
.dx-search{
  width:100%;padding:10px 14px;
  background:var(--surface2);border:1.5px solid var(--border2);
  border-radius:var(--radius);color:var(--text);font-size:0.9rem;
  font-family:var(--sans);outline:none;transition:border-color .18s,box-shadow .18s;
}
.dx-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.dx-search::placeholder{color:var(--muted2)}
.search-dropdown{
  position:absolute;top:calc(100%+4px);left:0;right:0;
  background:var(--surface2);border:1.5px solid var(--border2);
  border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.4);
  z-index:200;max-height:240px;overflow-y:auto;display:none;
}
.search-dropdown.show{display:block}
.sd-group-label{
  font-family:var(--mono);font-size:0.6rem;letter-spacing:.1em;
  color:var(--muted2);text-transform:uppercase;
  padding:8px 12px 4px;border-top:1px solid var(--border);
}
.sd-group-label:first-child{border-top:none}
.sd-item{
  padding:9px 13px;font-size:0.85rem;cursor:pointer;color:var(--text);
  transition:background .1s;display:flex;align-items:center;gap:8px;
}
.sd-item:hover,.sd-item.focused{background:var(--accent-dim);color:var(--accent)}
.sd-item.used{color:var(--muted2);cursor:default}
.sd-item.used:hover{background:transparent;color:var(--muted2)}
.sd-type{font-size:0.65rem;font-family:var(--mono);color:var(--muted2);margin-left:auto;flex-shrink:0}
.sd-type.umbrella{color:var(--teal)}
.sd-type.subtype{color:var(--purple);padding-left:10px}
.sd-empty{padding:10px 13px;font-size:0.83rem;color:var(--muted);font-style:italic}

/* tag type toggle */
.tag-type-row{display:flex;gap:6px;margin-bottom:14px}
.tag-type-btn{
  padding:5px 12px;border-radius:20px;font-size:0.74rem;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border2);color:var(--muted);
  background:var(--surface2);transition:all .15s;
}
.tag-type-btn:hover{border-color:var(--orange);color:var(--orange)}
.tag-type-btn.active-mnm{background:var(--red);border-color:var(--red);color:#fff}
.tag-type-btn.active-wd{background:var(--yellow);border-color:var(--yellow);color:#000}

/* differential list */
.diff-list{display:flex;flex-direction:column;gap:6px;min-height:40px}
.diff-empty{
  font-size:0.82rem;color:var(--muted2);font-style:italic;
  padding:10px 0;text-align:center;font-family:var(--mono);
}
.diff-entry{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:8px 12px;
  display:flex;align-items:flex-start;gap:8px;
  transition:border-color .15s;
  animation:entryIn .2s ease;
}
@keyframes entryIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.diff-entry.mnm{border-left:3px solid var(--red)}
.diff-entry.wd{border-left:3px solid var(--yellow)}
.diff-entry.eliminated{opacity:.35;border-style:dashed}
.diff-entry.eliminated .de-name{text-decoration:line-through}
.de-left{flex:1;min-width:0}
.de-name{font-size:0.88rem;font-weight:600;color:var(--text);line-height:1.3}
.de-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:0.65rem;font-family:var(--mono);font-weight:700;
  padding:2px 7px;border-radius:10px;margin-top:4px;
}
.de-tag.mnm{background:var(--red-dim);color:var(--red)}
.de-tag.wd{background:var(--yellow-dim);color:var(--yellow)}
.de-subtypes{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.de-subtype{
  font-size:0.72rem;padding:2px 8px;border-radius:20px;
  background:var(--surface3);border:1px solid var(--border2);color:var(--muted);
  cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:4px;
  font-family:var(--mono);
}
.de-subtype:hover{border-color:var(--red);color:var(--red)}
.de-subtype.elim{text-decoration:line-through;opacity:.4;border-color:transparent}
.de-subtype.elim:hover{opacity:.6;border-color:var(--muted2);color:var(--muted)}
.de-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.de-btn{
  background:none;border:1px solid var(--border2);border-radius:5px;
  padding:3px 7px;font-size:0.65rem;cursor:pointer;color:var(--muted);
  transition:all .12s;font-family:var(--mono);white-space:nowrap;
}
.de-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.de-btn.restore:hover{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.de-btn.expand{font-size:0.7rem}
.de-btn.expand:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}

/* MNM lock indicator */
.mnm-lock{
  display:inline-flex;align-items:center;gap:4px;
  font-size:0.65rem;font-family:var(--mono);color:var(--red);
  margin-top:3px;
}

/* ── PHASE 2: INVESTIGATION PANEL ────────────────────────────────────────── */
.inv-panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;
}
.inv-panel-label{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;
}
.cost-display{
  font-size:0.68rem;color:var(--muted2);font-family:var(--mono);
}
.inv-categories{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.inv-cat-btn{
  padding:5px 12px;border-radius:20px;font-size:0.75rem;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border2);color:var(--muted);
  background:var(--surface2);transition:all .15s;font-family:var(--mono);
}
.inv-cat-btn:hover,.inv-cat-btn.active{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.inv-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv-option{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:11px 13px;cursor:pointer;
  transition:all .18s;display:flex;flex-direction:column;gap:4px;
}
.inv-option:hover{border-color:var(--teal);background:var(--teal-dim)}
.inv-option.used{opacity:.4;cursor:default;border-style:dashed}
.inv-option.used:hover{border-color:var(--border);background:var(--surface2)}
.io-name{font-size:0.84rem;font-weight:600;color:var(--text)}
.io-cost{font-family:var(--mono);font-size:0.66rem;color:var(--muted2);display:flex;align-items:center;gap:4px}
.io-cost .cost-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.cost-low{color:var(--green)}.cost-low .cost-dot{background:var(--green)}
.cost-mid{color:var(--yellow)}.cost-mid .cost-dot{background:var(--yellow)}
.cost-high{color:var(--red)}.cost-high .cost-dot{background:var(--red)}

/* revealed findings */
.findings-area{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.finding-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 16px;
  border-left:3px solid var(--border2);
  animation:entryIn .25s ease;
}
.finding-card.history-f{border-left-color:var(--purple)}
.finding-card.exam-f{border-left-color:var(--teal)}
.finding-card.investigation-f{border-left-color:var(--yellow)}
.finding-card.imaging-f{border-left-color:var(--orange)}
.finding-type{
  font-family:var(--mono);font-size:0.6rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;
}
.finding-type.history-f{color:var(--purple)}
.finding-type.exam-f{color:var(--teal)}
.finding-type.investigation-f{color:var(--yellow)}
.finding-type.imaging-f{color:var(--orange)}
.finding-text{font-size:0.88rem;line-height:1.6;color:var(--text)}
.finding-hint{
  font-size:0.76rem;color:var(--muted);margin-top:6px;padding-top:6px;
  border-top:1px solid var(--border);font-style:italic;
}

/* cost irrelevance warning */
.cost-warning{
  display:flex;align-items:flex-start;gap:8px;
  background:var(--yellow-dim);border:1px solid var(--yellow);
  border-radius:var(--radius);padding:10px 13px;margin-top:8px;
  font-size:0.8rem;color:var(--yellow);line-height:1.5;
  animation:entryIn .25s ease;
}

/* ── COMMIT PHASE ────────────────────────────────────────────────────────── */
.commit-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:16px;
}
.commit-label{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:.1em;color:var(--orange);text-transform:uppercase;margin-bottom:14px;
}
.final-diff-list{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.fde{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:8px 12px;
  display:flex;align-items:center;gap:8px;cursor:pointer;
  transition:all .15s;
}
.fde:hover{border-color:var(--accent);background:var(--accent-dim)}
.fde.selected{border-color:var(--accent);background:var(--accent-dim)}
.fde.eliminated-f{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.fde.eliminated-f:hover{border-color:var(--border);background:var(--surface2)}
.fde-radio{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);
  flex-shrink:0;transition:all .15s;
}
.fde.selected .fde-radio{background:var(--accent);border-color:var(--accent)}
.fde-name{font-size:0.87rem;font-weight:600;flex:1}
.fde-tag{font-family:var(--mono);font-size:0.65rem}
.fde-tag.mnm-f{color:var(--red)}
.commit-btn{
  width:100%;padding:13px;border-radius:var(--radius);
  background:var(--orange);color:#fff;font-size:0.95rem;font-weight:700;
  border:none;cursor:pointer;transition:opacity .15s;font-family:var(--sans);
  letter-spacing:.02em;
}
.commit-btn:hover{opacity:.88}
.commit-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── CRITICAL MISS SCREEN ────────────────────────────────────────────────── */
.critical-miss{
  background:var(--red-dim);border:2px solid var(--red);
  border-radius:var(--radius-lg);padding:24px 26px;
  animation:shakeIn .35s ease;
}
@keyframes shakeIn{0%{transform:translateX(-8px)}20%{transform:translateX(8px)}40%{transform:translateX(-4px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.cm-icon{font-size:2.2rem;margin-bottom:10px}
.cm-title{font-size:1.3rem;font-weight:700;color:var(--red);margin-bottom:8px;font-family:var(--mono)}
.cm-body{font-size:0.9rem;line-height:1.7;color:var(--text);margin-bottom:16px}
.cm-missed{
  background:rgba(242,92,92,.1);border:1px solid var(--red);
  border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;
  font-size:0.85rem;color:var(--red);font-family:var(--mono);
}
.cm-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ── DEBRIEF SCREEN ──────────────────────────────────────────────────────── */
.debrief{display:flex;flex-direction:column;gap:16px}
.debrief-header{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px 22px;
}
.dh-outcome{font-family:var(--mono);font-size:0.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.dh-dx{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:4px}
.dh-sub{font-size:0.82rem;color:var(--muted)}

/* badges */
.badges-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.badge{
  display:flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:var(--radius);
  border:1.5px solid transparent;
  transition:opacity .2s;
}
.badge.earned{opacity:1}
.badge.unearned{opacity:.28;filter:saturate(0)}
.badge-icon{font-size:1.2rem}
.badge-text{display:flex;flex-direction:column}
.badge-name{font-size:0.8rem;font-weight:700}
.badge-desc{font-size:0.68rem;color:var(--muted)}
.badge.b-safety{background:var(--red-dim);border-color:var(--red)}
.badge.b-safety .badge-name{color:var(--red)}
.badge.b-efficient{background:var(--green-dim);border-color:var(--green)}
.badge.b-efficient .badge-name{color:var(--green)}
.badge.b-precision{background:var(--accent-dim);border-color:var(--accent)}
.badge.b-precision .badge-name{color:var(--accent)}
.badge.b-reasoner{background:var(--purple-dim);border-color:var(--purple)}
.badge.b-reasoner .badge-name{color:var(--purple)}

/* scoring breakdown */
.score-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 20px;
}
.score-label{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;
}
.score-rows{display:flex;flex-direction:column;gap:8px}
.score-row{display:flex;align-items:center;gap:10px;font-size:0.85rem}
.sr-name{flex:1;color:var(--text)}
.sr-bar{flex:2;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.sr-fill{height:100%;border-radius:3px;transition:width .6s .2s}
.sr-fill.good{background:var(--green)}
.sr-fill.ok{background:var(--yellow)}
.sr-fill.poor{background:var(--red)}
.sr-pts{font-family:var(--mono);font-size:0.78rem;color:var(--text);text-align:right;min-width:55px}
.score-total{
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.score-total-label{font-size:0.88rem;font-weight:700;color:var(--text)}
.score-total-num{font-family:var(--mono);font-size:1.15rem;font-weight:700;color:var(--accent)}

/* reasoning timeline */
.reasoning-timeline{display:flex;flex-direction:column;gap:0}
.rt-step{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 16px;
  margin-bottom:6px;
}
.rt-step-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rt-step-num{
  font-family:var(--mono);font-size:0.68rem;font-weight:700;
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface3);color:var(--muted);flex-shrink:0;
}
.rt-step-type{font-family:var(--mono);font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rt-step-cost{font-family:var(--mono);font-size:0.65rem;margin-left:auto;padding:2px 6px;border-radius:4px}
.rt-step-cost.c-free{background:var(--green-dim);color:var(--green)}
.rt-step-cost.c-low{background:var(--green-dim);color:var(--green)}
.rt-step-cost.c-mid{background:var(--yellow-dim);color:var(--yellow)}
.rt-step-cost.c-high{background:var(--red-dim);color:var(--red)}
.rt-finding{font-size:0.85rem;color:var(--text);line-height:1.5;margin-bottom:6px}
.rt-expert{
  font-size:0.8rem;color:var(--muted);line-height:1.55;
  border-top:1px solid var(--border);padding-top:8px;font-style:italic;
}
.rt-irrelevant{
  display:inline-flex;align-items:center;gap:4px;
  font-size:0.68rem;font-family:var(--mono);color:var(--yellow);
  background:var(--yellow-dim);padding:2px 6px;border-radius:4px;margin-bottom:6px;
}

/* sensitivity/specificity callouts */
.sens-spec{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 18px;
}
.ss-label{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;
}
.ss-row{display:flex;gap:8px;flex-wrap:wrap}
.ss-box{
  flex:1;min-width:140px;padding:10px 12px;border-radius:var(--radius);
  background:var(--surface2);border:1px solid var(--border);
}
.ss-box-title{font-size:0.72rem;font-weight:700;margin-bottom:4px}
.ss-box-text{font-size:0.78rem;color:var(--muted);line-height:1.5}
.ss-box.sens .ss-box-title{color:var(--teal)}
.ss-box.spec .ss-box-title{color:var(--purple)}
.ss-box.safety .ss-box-title{color:var(--red)}

/* debrief actions */
.debrief-actions{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:40px;margin-top:4px}
.action-btn{
  padding:10px 18px;border-radius:var(--radius);font-size:0.85rem;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border2);color:var(--muted);
  background:var(--surface);transition:all .15s;
}
.action-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.action-btn.primary:hover{opacity:.88}

/* ── PROGRESS DOTS ───────────────────────────────────────────────────────── */
.progress-dots{display:flex;gap:5px;align-items:center}
.pdot{
  width:7px;height:7px;border-radius:50%;background:var(--border2);
  transition:all .25s;
}
.pdot.done{background:var(--green)}
.pdot.active{background:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);width:9px;height:9px}
.pdot.missed{background:var(--red)}

/* ── UTILITY ─────────────────────────────────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:16px 0}
.tip-box{
  background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:10px 13px;font-size:0.8rem;color:var(--muted);
  line-height:1.55;margin-bottom:14px;
}
.tip-box strong{color:var(--accent)}

/* soft-recovery nudge */
.soft-nudge{
  background:var(--yellow-dim);border:1px solid var(--yellow);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;
  font-size:0.82rem;color:var(--yellow);line-height:1.55;
  animation:entryIn .25s ease;
}
.soft-nudge strong{color:#fff}

/* phase nav buttons */
.phase-nav{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pnav-btn{
  padding:9px 18px;border-radius:var(--radius);font-size:0.85rem;font-weight:700;
  cursor:pointer;border:none;transition:opacity .15s;
}
.pnav-btn:hover{opacity:.85}
.pnav-btn.continue{background:var(--teal);color:#000}
.pnav-btn.commit-phase{background:var(--orange);color:#fff}
.pnav-btn.secondary{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border2)}
.pnav-btn.secondary:hover{border-color:var(--muted);color:var(--text)}

/* professor hint */
.prof-hint{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.75rem;color:var(--muted);cursor:pointer;
  border:1px dashed var(--border2);border-radius:20px;padding:4px 11px;
  transition:all .15s;margin-top:8px;
}
.prof-hint:hover{border-color:var(--yellow);color:var(--yellow)}
.prof-hint-reveal{
  margin-top:8px;background:var(--yellow-dim);border:1px solid var(--yellow);
  border-radius:var(--radius);padding:9px 12px;font-size:0.8rem;color:var(--yellow);
  line-height:1.5;animation:entryIn .2s ease;
}

/* responsive */
@media(max-width:680px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:300;transform:translateX(-100%);transition:transform .25s}
  #sidebar.mobile-open{transform:translateX(0)}
  .inv-options{grid-template-columns:1fr}
  #content{padding:16px}
}
</style>

<script>
// ════════════════════════════════════════════════════════════════════════
// CASE DATA
// ════════════════════════════════════════════════════════════════════════
const CASES = [
  {

    title: "Epigastric Pain & Nausea",
    system: "Cardiovascular",
    finalDiagnosis: "Inferior STEMI",
    finalDiagnosisId: "cvs_001",

    snomedCode: "57054005",
    mustNotMiss: ["Myocardial Infarction", "Aortic Dissection"],

    vignette: "A 62-year-old male presents to the ED with a 2-hour history of epigastric pain and nausea. He describes it as a \"heavy\" sensation in the upper abdomen, radiating to his jaw. He has had two similar but milder episodes over the past week that resolved spontaneously.",

      { id:"gi_004", name:"Acute Cholecystitis", system:"Gastrointestinal", isUmbrella:false, mnm:false },
      { id:"gi_005", name:"Oesophageal Spasm", system:"Gastrointestinal", isUmbrella:false, mnm:false },
      // Respiratory
      { id:"resp_027", name:"Pulmonary Embolism", system:"Respiratory", isUmbrella:false, mnm:true },
    ],

    // Investigation rounds — each has category, name, cost tier, finding, expert reasoning, isRelevant
    investigations: [
      // HISTORY
      { id:"h1", category:"History", name:"Cardiovascular risk factors", costTier:"free",
        finding:"He has a 15-year history of hypertension and type 2 diabetes. He smokes 20 cigarettes/day for 30 years. Father had an MI at age 58.",
        isRelevant:true, relevantFor:["Myocardial Infarction","Unstable Angina","Aortic Dissection"],
        expert:"Strong cardiovascular risk profile (hypertension, DM, smoking, family history) significantly raises the pre-test probability of ACS. This narrows the differential substantially toward ischaemic causes. The episodic nature suggests crescendo angina — a hallmark of unstable ACS." },
      { id:"h2", category:"History", name:"Character & radiation of pain", costTier:"free",
        finding:"The pain is pressure-like, rated 7/10, radiating from epigastrium to jaw and left shoulder. Associated with diaphoresis and mild dyspnoea.",
        isRelevant:true, relevantFor:["Myocardial Infarction","Unstable Angina","Aortic Dissection"],
        expert:"Radiation to jaw and left shoulder with diaphoresis is a classic pattern of myocardial ischaemia, reflecting shared C3-C5 dermatome innervation. Inferior MI classically radiates to jaw and presents as epigastric pain — a critical diagnostic pitfall that causes missed diagnoses." },
      { id:"h3", category:"History", name:"GI history", costTier:"free",
        finding:"No prior history of peptic ulcer disease, no NSAID use, no relationship of pain to meals, no acid reflux symptoms.",
        isRelevant:true, relevantFor:["Peptic Ulcer Disease","GORD","Acute Pancreatitis"],
        expert:"Absence of a GI history, meal-related symptoms, or risk factors significantly reduces the probability of peptic ulcer disease and GORD as primary diagnoses. These were reasonable initial considerations but can now be deprioritised." },
      { id:"h4", category:"History", name:"Alcohol and gallstone history", costTier:"free",
        finding:"Drinks 1-2 units/week. No known gallstones. No prior abdominal surgeries.",
        isRelevant:false, relevantFor:["Acute Pancreatitis","Acute Cholecystitis"],
        expert:"This history reduces pancreatitis and cholecystitis probability further but is less discriminating than cardiovascular history at this stage." },
      // EXAMINATION
      { id:"e1", category:"Examination", name:"Vital signs", costTier:"low",
        finding:"BP 158/96 mmHg (bilateral arms equal), HR 58 bpm and regular, RR 18, SpO₂ 96% on room air, afebrile. Skin is diaphoretic.",
        isRelevant:true, relevantFor:["Myocardial Infarction","Unstable Angina","Aortic Dissection"],
        expert:"Equal bilateral BP largely excludes aortic dissection (which typically shows >20 mmHg difference). Bradycardia with diaphoresis and the overall haemodynamic profile is consistent with inferior MI — the inferior wall is supplied by the RCA, which also supplies the SA and AV nodes, causing bradyarrhythmias." },
      { id:"e2", category:"Examination", name:"Cardiovascular examination", costTier:"low",
        finding:"JVP not elevated. Heart sounds normal, no murmurs. Peripheral pulses equal. No peripheral oedema.",

      { id:"e3", category:"Examination", name:"Abdominal examination", costTier:"low",
        finding:"Abdomen soft, mild epigastric tenderness on deep palpation only. No guarding, no rebound, no Murphy's sign. Bowel sounds normal.",

        expert:"Absence of peritonism, Murphy's sign, and the mild non-localised epigastric tenderness on deep palpation are inconsistent with acute cholecystitis or peritonism from perforated PUD. This pattern is well-recognised in inferior MI where visceral pain projects to the epigastrium." },
      { id:"e4", category:"Examination", name:"Respiratory examination", costTier:"low",
        finding:"Lungs clear bilaterally, no crackles.",
        isRelevant:false, relevantFor:["Pulmonary Embolism"],
        expert:"Clear lungs reduce probability of PE-associated infarction and early pulmonary oedema. Reasonably reassuring but not definitive for excluding these." },
      // BASIC INVESTIGATIONS
      { id:"i1", category:"Basic Investigations", name:"12-lead ECG", costTier:"low",
        finding:"ST elevation 2-3 mm in leads II, III, and aVF. Reciprocal ST depression in I and aVL. Normal sinus rhythm at 56 bpm.",
        isRelevant:true, relevantFor:["Myocardial Infarction"],
        expert:"ST elevation in II, III, aVF with reciprocal changes in I and aVL is diagnostic of inferior STEMI — this is the single most important investigation in suspected ACS. The pattern localises to the right coronary artery (RCA) territory. This finding alone triggers the STEMI protocol. All GI diagnoses are now effectively excluded." },

    expertNarrative: "This case is a classic inferior STEMI presenting as epigastric pain — one of the most dangerous diagnostic pitfalls in emergency medicine. Inferior MI (RCA territory) frequently presents without classic central chest pain: epigastric pain, nausea, and vomiting are common due to shared vagal innervation. Key reasoning: (1) Never anchor on the 'epigastric' location — always obtain an ECG in any patient over 40 with unexplained upper abdominal pain. (2) Cardiovascular risk factors and radiation pattern should shift your differential heavily toward ACS early. (3) Equal BPs rule out dissection. (4) The ECG is the pivot — ST elevation in II/III/aVF with reciprocal depression is diagnostic and triggers immediate action. (5) Troponin confirms but must not delay reperfusion. Time-to-balloon is the primary outcome driver.",

    sensitivityNote: "Inferior MI can present identically to PUD, GORD, or acute pancreatitis — its sensitivity for 'typical' chest pain is LOW (~40-50%). This means a HIGHLY sensitive screening tool (ECG) must be applied broadly to all undifferentiated epigastric pain.",

  },

// DIAGNOSIS POOL (autocomplete source — all diagnosis names across cases)
// ════════════════════════════════════════════════════════════════════════
function buildDiagPool() {
  const seen = new Set();
  const pool = [];
  CASES.forEach(c => {
    c.differentialPool.forEach(d => {
      if (!seen.has(d.name)) {
        seen.add(d.name);
        pool.push(d);
      }
      if (d.subtypes) {
        d.subtypes.forEach(st => {
          if (!seen.has(st)) {
            seen.add(st);
            pool.push({ id: d.id+'_'+st, name: st, system: d.system, isSubtype: true, parentName: d.name, mnm: false });
          }
        });
      }
    });
  });
  return pool.sort((a,b) => a.name.localeCompare(b.name));
}
const DIAG_POOL = buildDiagPool();

// RENDER ROUTER
// ════════════════════════════════════════════════════════════════════════
function render() {
  buildSidebar();
  if (!G) { renderWelcome(); return; }
  updateTopbar();
  const cas = CASES[G.caseIdx];
  switch(G.phase) {
    case 'phase1': renderPhase1(); break;
    case 'phase2': renderPhase2(); break;
    case 'commit': renderCommit(); break;
    case 'debrief': renderDebrief(); break;
    case 'critical_miss': renderCriticalMiss(); break;
  }
}

function updateTopbar() {
  const cas = CASES[G.caseIdx];
  document.getElementById('tbCaseName').textContent = cas.title;
  const phases = {
    phase1: ['PHASE 1 — BUILD DIFFERENTIAL','phase-1'],
    phase2: ['PHASE 2 — INVESTIGATE','phase-2'],
    commit: ['PHASE 3 — COMMIT','phase-commit'],
    debrief: ['DEBRIEF','phase-debrief'],
    critical_miss: ['CRITICAL MISS','phase-1'],
  };
  const [label, cls] = phases[G.phase] || ['',''];
  const phaseEl = document.querySelector('.tb-phase');
  const effEl = document.querySelector('.efficiency-meter');
  const tbRight = document.getElementById('tbRight');
  const dots = buildProgressDots();
  tbRight.innerHTML = `<div class="progress-dots">${dots}</div>
    <div class="tb-phase ${cls}">${label}</div>
    <div class="efficiency-meter">
      <span>Eff</span>
      <div class="eff-bar"><div class="eff-fill" style="width:${Math.max(0,G.score.efficiency)}%;background:${G.score.efficiency>60?'var(--green)':G.score.efficiency>30?'var(--yellow)':'var(--red)'}"></div></div>
      <span>${Math.max(0,G.score.efficiency)}%</span>
    </div>`;
}

function buildProgressDots() {
  const invCount = CASES[G.caseIdx].investigations.filter(i=>i.isRelevant).length;
  const revealed = G.investigations.length;
  const steps = Math.max(5, invCount);
  return Array.from({length:steps},(_,i)=>{
    let cls = i < revealed ? 'done' : i === revealed ? 'active' : '';
    return `<div class="pdot ${cls}"></div>`;
  }).join('');
}

function proceedToPhase2() {
  if (G.differential.length < 2) {
    showSoftNudge('Please add at least 2 diagnoses to your differential before investigating.');
    return;

  const cas = CASES[G.caseIdx];
  const mnmMissed = cas.mustNotMiss.filter(m =>
    !G.differential.find(d => d.name === m || d.name.toLowerCase().includes(m.toLowerCase().split(' ')[0]))
  );
  if (mnmMissed.length > 0) {
    G.phase = 'critical_miss';
    G.missedMNM = mnmMissed;
    render();
    return;
  }
  G.phase = 'phase2';
  G.softNudge = null;
  render();
}

function getHardLockExplanation(name, cas) {
  if (name.toLowerCase().includes('myocardial') || name.toLowerCase().includes('infarct')) {
    return 'Inferior MI accounts for approximately 40% of all STEMIs and frequently presents as epigastric pain — it is the classic dangerous mimic. Without MI on your differential, you will not request an ECG, and door-to-balloon time will be critically delayed. Every minute of delay is equivalent to ~1,000 cardiomyocytes lost.';
  }
  if (name.toLowerCase().includes('dissection')) {
    return 'Aortic dissection carries a 1-2% per hour mortality if untreated. Failure to consider it means the distinguishing test (bilateral BP comparison, CT aortogram) will not be done.';
  }
  if (name.toLowerCase().includes('tuberculosis') || name.toLowerCase().includes('tb')) {
    return 'TB in Singapore is a notifiable disease. Missing it has consequences not just for the patient (delayed treatment → cavitation, dissemination) but for the 20 dormitory co-workers who need contact tracing and screening immediately.';
  }
  if (name.toLowerCase().includes('lung') || name.toLowerCase().includes('carcinoma')) {
    return 'Lung malignancy in a patient with haemoptysis and weight loss must be considered and excluded — delayed diagnosis typically means a higher stage at presentation, with significantly worse outcomes.';
  }
  return `${name} is a must-not-miss diagnosis in this presentation due to its time-sensitive nature and the consequences of delay.`;
}

function retryPhase1() {
  G.phase = 'phase1';
  G.missedMNM = [];
  render();
}

function forcePhase2() {
  G.phase = 'phase2';
  G.score.safety = 0; // no safety net badge
  G.mnmForced = true;
  render();
}

      <div class="inv-options">
        ${options.map(inv => `
          <div class="inv-option ${usedIds.has(inv.id)?'used':''}" onclick="${usedIds.has(inv.id)?'':'doInvestigation(\''+inv.id+'\')'}" title="${usedIds.has(inv.id)?'Already done':''}">
            <div class="io-name">${usedIds.has(inv.id)?'✓ ':''} ${inv.name}</div>
            <div class="io-cost cost-${inv.costTier}"><span class="cost-dot"></span>${COST_LABEL[inv.costTier]}${!inv.isRelevant?' · ⚠️ potential penalty':''}</div>
          </div>`
        ).join('')}
      </div>
    </div>

    <div class="diff-builder" style="padding:14px 18px">
      <div class="diff-builder-label" style="margin-bottom:10px">Your Current Differential <span style="font-size:0.68rem;font-family:var(--sans);font-weight:400;color:var(--muted2)">(click subtypes or "Eliminate" to update)</span></div>
      <div class="diff-list">${renderDiffList(true)}</div>
    </div>

    ${G.softNudge ? `<div class="soft-nudge">💬 <strong>Soft Recovery:</strong> ${G.softNudge}</div>` : ''}

    <div class="phase-nav">
      <button class="pnav-btn commit-phase" onclick="proceedToCommit()">Commit to Diagnosis →</button>
      <span class="prof-hint" onclick="showProfHint('phase2')">🎓 Ask the Professor</span>
    </div>
    ${G.profHintShown ? `<div class="prof-hint-reveal">💡 ${G.profHintText}</div>` : ''}
  `;
}

function setInvCat(cat) {
  G.activeInvCategory = cat;
  G.profHintShown = false;
  render();
}

function doInvestigation(invId) {
  const cas = CASES[G.caseIdx];
  const inv = cas.investigations.find(i=>i.id===invId);
  if (!inv) return;
  if (G.investigations.find(i=>i.id===invId)) return;

  G.investigations.push(inv);

  if (!inv.isRelevant) {
    const penalty = COST_PENALTY[inv.costTier].irrelevant;
    G.score.efficiency = Math.max(0, G.score.efficiency - penalty);
    G.irrelevantCount[inv.category] = (G.irrelevantCount[inv.category]||0) + 1;
    if (penalty > 0) {
      G.softNudge = `This ${inv.category.toLowerCase()} (${inv.name}) did not change your differential. ${inv.category === 'Advanced Investigations' ? 'Advanced investigations carry real cost and procedural risk — reserve them for when they\'ll change management.' : inv.category === 'Basic Investigations' ? 'Basic tests are low-cost but ordering them reflexively without clinical reasoning slows diagnosis.' : 'History-taking is low-risk but unfocused questions waste clinical time.'}`;
    } else {
      G.softNudge = null;
    }
  } else {
    G.softNudge = null;
    // Check if newly found info should trigger a soft recovery for missing dx
    checkSoftRecovery(inv);
  }
  render();
}

function checkSoftRecovery(inv) {
  if (!inv.isRelevant || !inv.relevantFor) return;
  const inDiff = G.differential.map(d=>d.name);
  const missing = inv.relevantFor.filter(dx => !inDiff.includes(dx) && !G.differential.find(d=>d.name.toLowerCase().includes(dx.toLowerCase().split(' ')[0])));
  if (missing.length > 0) {
    const cas = CASES[G.caseIdx];
    const mnmMissing = missing.filter(m => cas.mustNotMiss.includes(m));
    const nonMnmMissing = missing.filter(m => !cas.mustNotMiss.includes(m));
    if (nonMnmMissing.length > 0) {
      G.softNudge = `This finding is consistent with ${nonMnmMissing.join(' or ')} — consider adding it to your differential. You can still do so below. (Note: adding diagnoses reactively rather than proactively will be reflected in your Reasoner score.)`;
    }
  }
}

function proceedToCommit() {
  const active = G.differential.filter(d=>!d.eliminated);
  if (active.length === 0) {
    G.softNudge = 'You have eliminated all diagnoses — please restore at least one before committing.';
    render();
    return;
  }
  G.phase = 'commit';
  G.softNudge = null;
  render();
}

// ════════════════════════════════════════════════════════════════════════
// PHASE 3 — COMMIT
// ════════════════════════════════════════════════════════════════════════
function renderCommit() {
  const cas = CASES[G.caseIdx];
  const active = G.differential.filter(d=>!d.eliminated);
  const all = G.differential;

  document.getElementById('content').innerHTML = `
    <div class="phase-header">
      <div class="ph-num pc">Phase 3</div>
      <div><div class="ph-title">Commit to Your Diagnosis</div>
        <div class="ph-sub">Based on everything you've gathered — what is the most likely diagnosis?</div></div>
    </div>

    <div class="commit-card">
      <div class="commit-label">Your Remaining Differential</div>
      <div class="final-diff-list">
        ${all.map(d => `
          <div class="fde ${d.eliminated?'eliminated-f':''} ${G.committedDx===d.name?'selected':''}"
            onclick="${d.eliminated?'':'selectDx(\''+escJs(d.name)+'\')'}">
            <div class="fde-radio"></div>
            <div class="fde-name">${d.name}${d.eliminated?' (eliminated)':''}</div>
            ${d.mnm ? `<span class="fde-tag mnm-f">🔴 MNM</span>` : ''}
          </div>`
        ).join('')}
      </div>
      <button class="commit-btn" onclick="submitCommit()" ${!G.committedDx?'disabled':''}>
        ${G.committedDx ? `Commit: "${G.committedDx}" →` : 'Select a diagnosis above'}
      </button>
    </div>

    ${G.softNudge ? `<div class="soft-nudge">⚠️ ${G.softNudge}</div>` : ''}

    <div class="tip-box">
      <strong>Specificity now:</strong> You've gathered enough information. Which single diagnosis best explains all the findings? Eliminating diagnoses is as important as adding them — commit with confidence.
    </div>
  `;
}

function selectDx(name) {
  G.committedDx = name;
  render();
}

function submitCommit() {
  if (!G.committedDx) return;
  calculateScore();
  G.phase = 'debrief';
  render();
}

// ════════════════════════════════════════════════════════════════════════
// SCORING
// ════════════════════════════════════════════════════════════════════════
function calculateScore() {
  const cas = CASES[G.caseIdx];
  const isCorrect = G.committedDx === cas.finalDiagnosis ||
    G.committedDx === cas.finalUmbrella ||
    cas.finalDiagnosis.toLowerCase().includes(G.committedDx.toLowerCase()) ||
    G.committedDx.toLowerCase().includes(cas.finalDiagnosis.toLowerCase().split(' ')[0]);

  // Safety Net: had all MNMs in differential before phase2 and didn't force
  const hadAllMNM = !G.mnmForced;
  G.score.safety = hadAllMNM ? 100 : 0;

  // Precision: correct final diagnosis
  G.score.precision = isCorrect ? 100 : 0;

  // Efficiency: already tracked, just cap
  G.score.efficiency = Math.max(0, Math.min(100, G.score.efficiency));

  // Reasoner: did they add diagnoses reactively (after relevant finding nudged them)?
  // Penalise if final differential doesn't include the correct answer AND they used >6 investigations
  const reactiveNudges = G.softNudge ? 1 : 0;
  const invCount = G.investigations.length;
  const relevantCount = G.investigations.filter(i=>i.isRelevant).length;
  const hitRatio = invCount > 0 ? relevantCount / invCount : 1;
  G.score.reasoner = Math.round(hitRatio * 100);
}

// ════════════════════════════════════════════════════════════════════════
// DEBRIEF
// ════════════════════════════════════════════════════════════════════════
function renderDebrief() {
  const cas = CASES[G.caseIdx];
  const s = G.score;
  const isCorrect = s.precision === 100;

  const badges = [
    { key:'safety', icon:'🛡️', name:'Safety Net', desc:'All must-not-miss diagnoses in differential', cls:'b-safety', earned: s.safety===100 },
    { key:'efficient', icon:'⚡', name:'Efficient', desc:'Minimal unnecessary investigations', cls:'b-efficient', earned: s.efficiency>=70 },
    { key:'precision', icon:'🎯', name:'Precision', desc:'Correct final diagnosis', cls:'b-precision', earned: isCorrect },
    { key:'reasoner', icon:'🧠', name:'Reasoner', desc:'High ratio of relevant investigations chosen', cls:'b-reasoner', earned: s.reasoner>=75 },
  ];

  const scoreRows = [
    { name:'Safety Net', pts:s.safety, max:100 },
    { name:'Efficiency', pts:s.efficiency, max:100 },
    { name:'Precision', pts:s.precision, max:100 },
    { name:'Reasoning', pts:s.reasoner, max:100 },
  ];
  const total = Math.round(scoreRows.reduce((sum,r)=>sum+r.pts,0)/4);
  const totalClass = total >= 75 ? 'good' : total >= 50 ? 'ok' : 'poor';

  const timelineHTML = G.investigations.map((inv,i) => {
    const typeClass = {History:'history-f',Examination:'exam-f','Basic Investigations':'investigation-f','Advanced Investigations':'imaging-f'}[inv.category]||'';
    return `<div class="rt-step">
      <div class="rt-step-header">
        <div class="rt-step-num">${i+1}</div>
        <div class="rt-step-type">${inv.category} → ${inv.name}</div>
        <div class="rt-step-cost ${COST_CLASS[inv.costTier]}">${COST_LABEL[inv.costTier]}</div>
      </div>
      ${!inv.isRelevant ? `<div class="rt-irrelevant">⚠️ Did not change differential</div>` : ''}
      <div class="rt-finding">${inv.finding}</div>
      <div class="rt-expert">💡 ${inv.expert}</div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="debrief">
      <div class="debrief-header">
        <div class="dh-outcome">${isCorrect ? '✅ Correct Diagnosis' : '❌ Incorrect Diagnosis'}</div>
        <div class="dh-dx">${cas.finalDiagnosis}</div>
        <div class="dh-sub">SNOMED: ${cas.snomedCode} · Your answer: ${G.committedDx || 'Not committed'}</div>
        <div class="badges-row">
          ${badges.map(b=>`<div class="badge ${b.cls} ${b.earned?'earned':'unearned'}">
            <span class="badge-icon">${b.icon}</span>
            <div class="badge-text"><span class="badge-name">${b.name}</span><span class="badge-desc">${b.desc}</span></div>
          </div>`).join('')}
        </div>
      </div>

      <div class="score-card">
        <div class="score-label">Score Breakdown</div>
        <div class="score-rows">
          ${scoreRows.map(r=>{
            const pct = (r.pts/r.max)*100;
            const cls = pct>=75?'good':pct>=50?'ok':'poor';
            return `<div class="score-row">
              <span class="sr-name">${r.name}</span>
              <div class="sr-bar"><div class="sr-fill ${cls}" style="width:${pct}%"></div></div>
              <span class="sr-pts">${r.pts} / ${r.max}</span>
            </div>`;
          }).join('')}
        </div>
        <div class="score-total">
          <span class="score-total-label">Overall Score</span>
          <span class="score-total-num ${totalClass}">${total} / 100</span>
        </div>
      </div>

      <div class="score-card">
        <div class="score-label">Expert Reasoning</div>
        <p style="font-size:0.88rem;line-height:1.7;color:var(--muted)">${cas.expertNarrative}</p>
      </div>

      <div class="sens-spec">
        <div class="ss-label">Sensitivity & Specificity — This Case</div>
        <div class="ss-row">
          <div class="ss-box sens">
            <div class="ss-box-title">🔍 Sensitivity Thinking</div>
            <div class="ss-box-text">${cas.sensitivityNote}</div>
          </div>
          <div class="ss-box spec">
            <div class="ss-box-title">🎯 Specificity Thinking</div>
            <div class="ss-box-text">${cas.specificityNote}</div>
          </div>
          <div class="ss-box safety">
            <div class="ss-box-title">🛡️ Safety Net Rule</div>
            <div class="ss-box-text">Must-not-miss diagnoses require HIGH sensitivity screening — apply the relevant test early, even when probability seems low, because the cost of missing them is catastrophic.</div>
          </div>
        </div>
      </div>

      <div class="score-card">
        <div class="score-label">Your Investigation Pathway</div>
        <div class="reasoning-timeline">${timelineHTML || '<div style="color:var(--muted);font-size:0.85rem;font-style:italic">No investigations performed.</div>'}</div>
      </div>

      <div class="debrief-actions">
        <button class="action-btn primary" onclick="startCase(${G.caseIdx})">Try Again</button>
        <button class="action-btn" onclick="startCase(${(G.caseIdx+1)%CASES.length})">Next Case →</button>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════
// DIFFERENTIAL LIST RENDERER
// ════════════════════════════════════════════════════════════════════════
function renderDiffList(interactive=false) {
  if (!G.differential.length) return '<div class="diff-empty">No diagnoses added yet</div>';
  return G.differential.map((d,i) => {
    const cas = CASES[G.caseIdx];
    const poolEntry = cas.differentialPool.find(p=>p.name===d.name);
    const subtypes = poolEntry?.subtypes || [];
    return `<div class="diff-entry ${d.tag} ${d.eliminated?'eliminated':''}">
      <div class="de-left">
        <div class="de-name">${d.name}</div>
        <div><span class="de-tag ${d.tag}">${d.tag==='mnm'?'🔴 Must Not Miss':'🟡 Working Dx'}</span></div>
        ${d.mnm ? `<div class="mnm-lock">🔒 Hard-locked — cannot be fully removed</div>` : ''}
        ${subtypes.length > 0 ? `<div class="de-subtypes">
          ${subtypes.map(st=>`<span class="de-subtype ${d.eliminatedSubtypes.includes(st)?'elim':''}"
            onclick="toggleSubtype(${i},'${escJs(st)}')" title="${d.eliminatedSubtypes.includes(st)?'Restore this subtype':'Eliminate this subtype'}">
            ${d.eliminatedSubtypes.includes(st)?'✕ ':''}${st}
          </span>`).join('')}
        </div>` : ''}
      </div>
      <div class="de-actions">
        ${d.eliminated
          ? `<button class="de-btn restore" onclick="restoreDiff(${i})">Restore</button>`
          : `<button class="de-btn" onclick="eliminateDiff(${i})">${d.mnm?'Deprioritise':'Eliminate'}</button>`
        }
        ${subtypes.length > 0 ? `<button class="de-btn expand" onclick="toggleSubtypes(${i})">${d.subtypesExpanded?'▲':'▼'} subtypes</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function eliminateDiff(i) {
  if (G.differential[i].mnm) {
    G.differential[i].eliminated = true; // soft deprioritise only
    G.differential[i].tag = 'wd'; // downgrade
    // Show warning
    G.softNudge = `⚠️ "${G.differential[i].name}" is a must-not-miss diagnosis. You've deprioritised it but it remains on your list — eliminating a MNM entirely requires strong evidence.`;
  } else {
    G.differential[i].eliminated = true;
  }
  re_renderDiff();
}

function restoreDiff(i) {
  G.differential[i].eliminated = false;
  re_renderDiff();
}

function toggleSubtype(diagIdx, subtype) {
  const d = G.differential[diagIdx];
  if (!d) return;
  const idx = d.eliminatedSubtypes.indexOf(subtype);
  if (idx >= 0) {
    d.eliminatedSubtypes.splice(idx,1);
  } else {
    d.eliminatedSubtypes.push(subtype);
  }
  re_renderDiff();
}

function toggleSubtypes(diagIdx) {
  G.differential[diagIdx].subtypesExpanded = !G.differential[diagIdx].subtypesExpanded;
  re_renderDiff();
}

function re_renderDiff() {
  const el = document.getElementById('diffList');
  if (el) el.innerHTML = renderDiffList() || '<div class="diff-empty">No diagnoses added yet</div>';
}

// ════════════════════════════════════════════════════════════════════════
// SEARCH / AUTOCOMPLETE
// ════════════════════════════════════════════════════════════════════════
let srFocusIdx = -1;
let searchSelected = '';

function bindSearchEvents() {
  document.addEventListener('mousedown', outsideClickHandler, true);
}
function outsideClickHandler(e) {
  const wrap = document.querySelector('.search-wrap');
  if (!wrap || !wrap.contains(e.target)) closeDropdown();
}
function showDropdown() {
  renderDropdown(document.getElementById('dxSearch')?.value||'');
}
function onSearchInput() {
  searchSelected = '';
  srFocusIdx = -1;
  G.searchQuery = document.getElementById('dxSearch').value;
  renderDropdown(G.searchQuery);
}
function renderDropdown(q) {
  const dd = document.getElementById('searchDropdown');
  if (!dd) return;
  const query = q.trim().toLowerCase();
  const alreadyIn = new Set(G.differential.map(d=>d.name));
  const cas = CASES[G.caseIdx];

  // Filter from case's differential pool (umbrella + subtypes)
  let matches = [];
  cas.differentialPool.forEach(d => {
    const nameMatch = !query || d.name.toLowerCase().includes(query);
    if (nameMatch) matches.push({...d, isSubtype:false});
    if (d.subtypes) {
      d.subtypes.forEach(st => {
        if (!query || st.toLowerCase().includes(query)) {
          matches.push({ id:d.id+'_'+st, name:st, system:d.system, isSubtype:true, parentName:d.name, mnm:false });
        }
      });
    }
  });
  if (!query) matches = matches.slice(0,20);

  if (!matches.length) {
    dd.innerHTML = `<div class="sd-empty">No matches found</div>`;
  } else {
    // Group by system
    const grouped = {};
    matches.forEach(m => {
      const sys = m.system || 'Other';
      if (!grouped[sys]) grouped[sys] = [];
      grouped[sys].push(m);
    });
    let html = '';
    let idx = 0;
    Object.entries(grouped).forEach(([sys, items]) => {
      html += `<div class="sd-group-label">${sys}</div>`;
      items.forEach(m => {
        const used = alreadyIn.has(m.name);
        const hl = query ? m.name.replace(new RegExp(`(${escRe(query)})`, 'gi'), '<strong>$1</strong>') : m.name;
        html += `<div class="sd-item${used?' used':''}" data-val="${escHtml(m.name)}" data-idx="${idx}"
          onmousedown="pickDiag('${escJs(m.name)}',${used})">
          <span>${hl}</span>
          <span class="sd-type ${m.isSubtype?'subtype':'umbrella'}">${m.isSubtype?'subtype':'umbrella'}</span>
          ${used ? '<span style="font-size:0.65rem;color:var(--muted2);margin-left:auto">✓ added</span>' : ''}
        </div>`;
        idx++;
      });
    });
    dd.innerHTML = html;
  }
  dd.classList.add('show');
  srFocusIdx = -1;
}

function onSearchKey(e) {
  const dd = document.getElementById('searchDropdown');
  const items = dd ? [...dd.querySelectorAll('.sd-item:not(.used)')] : [];
  if (e.key==='ArrowDown'){ e.preventDefault(); srFocusIdx=Math.min(srFocusIdx+1,items.length-1); updateFocus(items); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); srFocusIdx=Math.max(srFocusIdx-1,-1); updateFocus(items); }
  else if (e.key==='Enter'){ e.preventDefault(); if(srFocusIdx>=0&&items[srFocusIdx]) pickDiag(items[srFocusIdx].dataset.val,false); else addTopmatch(); }
  else if (e.key==='Escape') closeDropdown();
}
function updateFocus(items) {
  items.forEach((it,i)=>it.classList.toggle('focused',i===srFocusIdx));
  if (items[srFocusIdx]) items[srFocusIdx].scrollIntoView({block:'nearest'});
}
function closeDropdown() {
  document.getElementById('searchDropdown')?.classList.remove('show');
  srFocusIdx = -1;
}
function addTopmatch() {
  const q = (document.getElementById('dxSearch')?.value||'').trim().toLowerCase();
  if (!q) return;
  const cas = CASES[G.caseIdx];
  const match = cas.differentialPool.find(d=>d.name.toLowerCase().includes(q));
  if (match) pickDiag(match.name, false);
}
function pickDiag(name, used) {
  if (used) return;
  const inp = document.getElementById('dxSearch');
  if (inp) { inp.value = ''; G.searchQuery = ''; }
  closeDropdown();
  addDiagToList(name);
}

function addDiagToList(name) {
  if (G.differential.find(d=>d.name===name)) return;
  const cas = CASES[G.caseIdx];
  const poolEntry = cas.differentialPool.find(p=>p.name===name || (p.subtypes&&p.subtypes.includes(name)));
  const isMNM = poolEntry?.mnm || false;
  G.differential.push({
    name, tag: G.pendingTagType,
    eliminated: false,
    eliminatedSubtypes: [],
    subtypesExpanded: false,
    mnm: isMNM,
  });
  re_renderDiff();
}

// ════════════════════════════════════════════════════════════════════════
// PROFESSOR HINT
// ════════════════════════════════════════════════════════════════════════
function showProfHint(phase) {
  const cas = CASES[G.caseIdx];
  const hints = {
    phase1: `Think about the system involved first. For this presentation, consider: which systems could explain ALL the symptoms together? Then within each relevant system, work through VITAMIN CDE. Don't forget that some diagnoses present atypically — especially cardiovascular and infectious causes.`,
    phase2: `Which investigation will most efficiently narrow your differential? Start with: (1) investigations that could rule in or rule out a must-not-miss diagnosis, (2) the most specific test for your top working diagnosis. Advanced investigations are expensive and carry risk — don't use them before establishing a clear indication.`
  };
  G.profHintShown = !G.profHintShown;
  G.profHintText = hints[phase] || '';
  const el = document.querySelector('.prof-hint-reveal');
  if (el) { el.style.display = G.profHintShown ? 'block' : 'none'; el.textContent = '💡 ' + G.profHintText; }
  else render();
}

// ════════════════════════════════════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════════════════════════════════════
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

// ════════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════════
render();
</script>
